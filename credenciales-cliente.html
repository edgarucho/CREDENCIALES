<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credencial escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#241d16; --papel:#f6efe5; --acento:#c5572a;
  --linea:#ddd1bd; --linea2:#c2b39c; --verde:#3f6b4f; --alerta:#a83232;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15.5px;line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

header{
  background:var(--tinta);color:var(--papel);padding:12px 18px;
  border-bottom:3px solid var(--acento);display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:30;
}
.marca{font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.05em;font-size:14.5px;line-height:1.25}
.marca small{display:block;font-size:9px;letter-spacing:.28em;opacity:.6;font-weight:500;margin-top:2px}
.volver{
  margin-left:auto;background:none;border:1px solid rgba(246,239,229,.35);color:inherit;
  border-radius:4px;padding:6px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;flex:none;
}
.volver:hover{background:rgba(255,255,255,.12)}
.env{max-width:720px;margin:0 auto;padding:24px 18px 90px}

.pasos{display:flex;margin:0 0 26px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em}
.pasos span{
  flex:1;text-align:center;padding:7px 3px;border-bottom:2px solid var(--linea2);
  color:#9a8a75;text-transform:uppercase;
}
.pasos span.on{color:var(--tinta);border-color:var(--acento);font-weight:600}
.pasos span.fin{color:var(--verde);border-color:var(--verde)}

h1{font-family:Archivo,sans-serif;font-size:clamp(21px,4.4vw,29px);letter-spacing:-.01em;margin:0 0 6px;font-weight:800}
.sub{color:#7d6d59;margin:0 0 24px;font-size:14.5px}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tarj{
  text-align:left;background:#fff;border:1px solid var(--linea);border-radius:6px;
  padding:0;transition:.14s;overflow:hidden;
}
.tarj:hover{border-color:var(--acento);transform:translateY(-2px);box-shadow:0 8px 22px rgba(36,29,22,.10)}
.tarj img{display:block;width:100%;background:#fff;border-bottom:1px solid var(--linea)}
.tarj .cap{padding:14px 16px;display:flex;align-items:center;gap:10px}
.tarj .nm{font-family:Archivo,sans-serif;font-weight:700;font-size:16.5px;flex:1}
.tarj .ir{font-size:19px;color:var(--acento)}

fieldset{border:0;padding:0;margin:0 0 22px}
legend{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#8a7a66;padding:0;margin-bottom:12px;width:100%;border-bottom:1px solid var(--linea2);padding-bottom:6px;
}
.c{margin-bottom:16px;scroll-margin-top:96px}
.c label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.c label .ob{color:var(--acento)}
.c .ay{color:#8a7a66;font-size:12.5px;margin:-2px 0 6px}
.c input[type=text],.c textarea{
  width:100%;padding:11px 12px;border:1px solid var(--linea2);border-radius:5px;background:#fff;font-size:16px;
}
.c textarea{resize:vertical;min-height:70px}
.c input:focus,.c textarea:focus{outline:2px solid var(--acento);outline-offset:-1px;border-color:var(--acento)}
.c.falta input,.c.falta textarea,.c.falta .sub-foto,.c.falta .sub-firma{border-color:var(--alerta);background:#fdf6f4}
.c.destacado{animation:brillo 1.6s ease-out}
@keyframes brillo{0%{box-shadow:0 0 0 6px rgba(197,87,42,.28)}100%{box-shadow:0 0 0 0 rgba(197,87,42,0)}}

.sub-foto{border:1px dashed var(--linea2);border-radius:5px;background:#fff;padding:12px;display:flex;gap:12px;align-items:center}
.sub-foto .mini{width:64px;height:78px;border:1px solid var(--linea);background:#f0e8db;flex:none;display:block;border-radius:2px;background-size:cover;background-position:center}
.sub-foto .txt{flex:1;min-width:0}
.sub-foto .txt b{display:block;font-size:13.5px}
.sub-foto .txt span{color:#8a7a66;font-size:12.5px}
.ctrl{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:12px;color:#7d6d59}
.ctrl input[type=range]{width:100%;accent-color:var(--acento)}
.fprev{grid-column:1 / -1;justify-self:center;max-width:100%;border:2px solid var(--acento);border-radius:8px;margin-bottom:6px;background:#f0ece4}

.sub-firma{border:1px dashed var(--linea2);border-radius:5px;background:#fff;padding:12px;text-align:center}
.aviso-estudio{background:#eef6f0;border:1px solid #bfe0cb;border-radius:6px;padding:12px;font-size:13.5px;color:#1f7a4d;font-weight:600}
.extras{background:#faf5ec;border:1px solid var(--linea2);border-radius:10px;padding:14px 16px;margin:8px 0 4px}
.ex-ln{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--tinta)}
.cant{display:flex;align-items:center;gap:14px}
.cant button{width:38px;height:38px;border:none;border-radius:8px;background:var(--acento);color:#fff;font-size:22px;font-weight:800;cursor:pointer;line-height:1}
.cant span{min-width:26px;text-align:center;font-size:18px;font-weight:800}
.ex-gaf{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:14px;color:var(--tinta);cursor:pointer;line-height:1.35}
.ex-gaf input{margin-top:2px;transform:scale(1.2)}
.ex-gaf-info{margin-top:12px;font-size:13.5px;color:#1f7a4d;font-weight:600;background:#eef6f0;border:1px solid #bfe0cb;border-radius:8px;padding:10px 12px}
.aviso-gaf{background:#fff4e8;border:1px solid #f0c89a;border-radius:10px;padding:13px 15px;font-size:14px;color:#8a5a1e;line-height:1.4;margin:0 0 16px}
.modo-foto.pri{background:var(--tinta,#241d16);color:#fff}
.sub-firma img{max-height:70px;display:block;margin:0 auto 8px}

.b{
  border:1px solid var(--linea2);background:#fff;padding:10px 16px;border-radius:5px;
  font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:.12s;
}
.b:hover{background:#efe6d9}
.b.pri{background:var(--acento);border-color:var(--acento);color:#fff}
.b.pri:hover{background:#a8461f}
.b.gr{width:100%;padding:15px;font-size:14px}
.b.chico{padding:6px 11px;font-size:11.5px}
.b:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.b[disabled]{opacity:.55;cursor:not-allowed}

.rev{background:#fff;border:1px solid var(--linea);border-radius:6px;overflow:hidden;margin-bottom:18px}
.rev .ln{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--linea)}
.rev .ln:last-child{border-bottom:0}
.rev .et{flex:none;width:38%;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a7a66;padding-top:2px}
.rev .vl{flex:1;font-weight:600;word-break:break-word}
.rev .vl.sin{font-weight:400;color:#a4907a;font-style:italic}
.rev .ln button{flex:none;background:none;border:0;color:var(--acento);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.rev .ln button:hover{text-decoration:underline}

.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.fot{background:#fff;border:1px solid var(--linea);border-radius:6px;overflow:hidden;text-align:center}
.fot .im{width:100%;aspect-ratio:3/4;background:#f0e8db center/cover no-repeat;display:block}
.fot .im.firma{aspect-ratio:3/1.4;background-size:contain;background-color:#fff}
.fot .pie{padding:9px 8px}
.fot .pie b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8a7a66;margin-bottom:6px;line-height:1.3}

.nota{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--acento);border-radius:6px;padding:14px 16px;margin-bottom:20px;font-size:14px;color:#5f5140}
.listo{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--verde);border-radius:6px;padding:22px}
.listo h2{font-family:Archivo,sans-serif;margin:0 0 8px;font-size:21px}
.folio{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.1em;background:#f0e8db;padding:8px 12px;border-radius:4px;display:inline-block;margin-top:12px}
.malo{border-left-color:var(--alerta)}

.velo{position:fixed;inset:0;background:rgba(36,29,22,.7);display:none;place-items:center;padding:16px;z-index:70}
.velo.on{display:grid}
.modal{background:var(--papel);border-radius:8px;max-width:560px;width:100%;padding:20px}
.modal h3{font-family:Archivo,sans-serif;margin:0 0 4px;font-size:19px}
.modal p.mini{color:#7d6d59;font-size:13.5px;margin:0 0 14px}
#firmaLienzo{
  width:100%;height:230px;background:#fff;border:1px solid var(--linea2);border-radius:5px;
  touch-action:none;display:block;cursor:crosshair;
}
.renglon{height:1px;background:var(--linea2);margin:-52px 28px 0;pointer-events:none}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.cargando{text-align:center;padding:44px 20px}
.rueda{width:42px;height:42px;border:3px solid var(--linea2);border-top-color:var(--acento);border-radius:50%;margin:0 auto 18px;animation:giro .9s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.cargando p{color:#7d6d59;margin:0}

.aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);
  background:var(--tinta);color:var(--papel);padding:11px 20px;border-radius:24px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:88vw;text-align:center}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}
.aviso.mal{background:var(--alerta)}

@media(max-width:520px){
  .rev .et{width:100%}
  .rev .ln{flex-wrap:wrap;gap:4px 12px}
  .rev .vl{width:100%;order:3}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="marca" id="cabecera">Credencial escolar<small>LLENADO EN LÍNEA</small></div>
  <button class="volver" id="bVolver" hidden>Volver</button>
</header>

<div class="env">
  <div class="pasos" id="pasos" hidden>
    <span id="p1">1 · Documento</span><span id="p2">2 · Datos</span><span id="p3">3 · Revisar</span><span id="p4">4 · Enviar</span>
  </div>
  <div id="vista"></div>
</div>

<div class="velo" id="veloFirma">
  <div class="modal">
    <h3>Firme aquí</h3>
    <p class="mini">Use el dedo sobre la línea. Si no queda bien, borre y repita.</p>
    <canvas id="firmaLienzo"></canvas>
    <div class="renglon"></div>
    <div class="pie">
      <button class="b" id="fBorrar">Borrar</button>
      <button class="b" id="fCancel">Cancelar</button>
      <button class="b pri" id="fOk">Usar esta firma</button>
    </div>
  </div>
</div>

<div class="aviso" id="aviso"></div>

<script src="credenciales-plantillas.js"></script>
<script src="credenciales-motor.js"></script>
<script>
(function(){
'use strict';
var D = CEDULA.cargarDatos();
// Las credenciales se envían al MISMO backend de las fotos (Drive + POS + Vigilante)
var CRED_BACKEND = "https://script.google.com/macros/s/AKfycbxN01-DfwGkwwfilu6lfk_AYMMLa1S2SfJCkKYRMOYve948MtRB93N9blMU9vamD72I/exec";
var E = null, pltSel = null, V = {}, paso = 0, intentoEnvio = false, irA = null;
var CODIGO_USO = '';   // código de un solo uso de esta liga
var TITULAR_FIJO = ''; // nombre del niño puesto en el POS (bloqueado)
var CANTIDAD = 1;      // cuántas credenciales quiere
var QUIERE_GAFETE = false; // también quiere gafete (mismos datos)
var GAFETE_OBLIGATORIO = false; // la escuela incluye gafete obligatorio
var $ = function(s){ return document.querySelector(s); };
/* Hora: "08:00" (input) -> "8:00" para separar; y a formato legible 12h opcional */
function hhmm(s){ s = String(s||'').trim(); var m = /(\d{1,2}):(\d{2})/.exec(s); return m ? (('0'+m[1]).slice(-2)+':'+m[2]) : ''; }
function hhmm12(s){
  var m = /(\d{1,2}):(\d{2})/.exec(String(s||'')); if(!m) return String(s||'');
  var h = parseInt(m[1],10), min = m[2];
  return h + ':' + min;   // formato simple 24h sin cero a la izquierda (ej: 8:00, 14:30)
}
var vista = $('#vista');

function avisar(t, mal){
  var a = $('#aviso'); a.textContent = t; a.className = 'aviso on' + (mal ? ' mal' : '');
  clearTimeout(a._t); a._t = setTimeout(function(){ a.className = 'aviso'; }, 3200);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
function plantilla(){ return E ? E.plantillas.find(function(p){ return p.id === pltSel; }) : null; }
function campos(){ var p = plantilla(); return p ? p.campos.filter(function(c){ return c.tipo !== 'corte'; }) : []; }
function cortes(){ var p = plantilla(); return p ? p.campos.filter(function(c){ return c.tipo === 'corte'; }) : []; }
function normaliza(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9]/g, '').toUpperCase();
}

function marcarPasos(){
  $('#pasos').hidden = paso < 1;
  [1,2,3,4].forEach(function(n){
    var el = $('#p'+n); el.className = n === paso ? 'on' : (n < paso ? 'fin' : '');
  });
  $('#bVolver').hidden = paso < 2 || paso === 4;
}

/* ============ ACCESO POR CÓDIGO ============ */
function codigoDeLiga(){
  var q = new URLSearchParams(location.search).get('c');
  if (!q && location.hash) q = new URLSearchParams(location.hash.slice(1)).get('c');
  return normaliza(q);
}
function buscarEscuela(cod){
  if (!cod) return null;
  return D.escuelas.find(function(e){
    return normaliza(e.codigo) === cod || normaliza(e.id) === cod || normaliza(e.corto) === cod;
  }) || null;
}
function iniciar(){
  var cod = codigoDeLiga();
  if (!cod){
    paso = 0; marcarPasos();
    vista.innerHTML = '<h1>Necesitas tu liga de acceso</h1><p class="sub">Este formulario se abre con la liga que te enviamos por WhatsApp. Solicítala para continuar.</p>';
    return;
  }
  // Validar el código (un solo uso) con el servidor
  vista.innerHTML = '<div class="cargando"><div class="rueda"></div><p>Validando tu liga…</p></div>';
  fetch(CRED_BACKEND, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'credcode', code: cod })
  }).then(function(r){ return r.json(); }).then(function(res){
    if (!res || !res.ok) throw new Error('codigo');
    CODIGO_USO = cod;                       // se manda al enviar (para consumirlo)
    TITULAR_FIJO = (res.titular || '').trim();   // nombre del niño puesto en el POS (bloqueado)
    E = buscarEscuela(normaliza(res.escuela));
    if (!E) throw new Error('sin_escuela');
    $('#cabecera').innerHTML = esc(E.corto || E.nombre) +
      '<small>' + esc((E.ciudad || 'llenado en línea').toUpperCase()) + '</small>';
    document.title = (E.corto || E.nombre) + ' · Credencial';
    verDocumentos();
  }).catch(function(err){
    paso = 0; marcarPasos();
    vista.innerHTML = (err && err.message==='sin_escuela')
      ? '<h1>Liga sin escuela</h1><p class="sub">Esta liga no tiene una escuela válida. Pide una nueva.</p>'
      : '<h1>Esta liga ya no es válida</h1><p class="sub">La liga es de un solo uso, o ya expiró. Pide una nueva a quien te la envió.</p>';
  });
}

/* ============ PASO 1: DOCUMENTO ============ */
function verDocumentos(){
  paso = 1; pltSel = null; V = {}; intentoEnvio = false; marcarPasos();
  if (!E.plantillas.length){
    vista.innerHTML = '<h1>Sin documentos disponibles</h1><p class="sub">Esta escuela todavía no tiene formatos cargados.</p>';
    return;
  }
  // Si la escuela tiene GAFETE, es obligatorio: se llena la credencial y el gafete viene automático.
  var gafetePlt = E.plantillas.find(function(t){ return /gafete/i.test(t.nombre); });
  var credPlt   = E.plantillas.find(function(t){ return !/gafete/i.test(t.nombre); });
  if (gafetePlt && credPlt){
    GAFETE_OBLIGATORIO = true;
    QUIERE_GAFETE = true;
    pltSel = credPlt.id;
    return verFormulario();
  }
  GAFETE_OBLIGATORIO = false; QUIERE_GAFETE = false;
  if (E.plantillas.length === 1){ pltSel = E.plantillas[0].id; return verFormulario(); }
  var h = '<h1>' + esc(E.nombre) + '</h1><p class="sub">¿Qué documento vas a llenar?</p><div class="rejilla">';
  E.plantillas.forEach(function(p){
    h += '<button class="tarj" data-p="' + esc(p.id) + '">' +
      '<img src="' + p.imagen + '" alt="Formato de ' + esc(p.nombre) + '" loading="lazy">' +
      '<span class="cap"><span class="nm">' + esc(p.nombre) + '</span><span class="ir">&#8594;</span></span></button>';
  });
  vista.innerHTML = h + '</div>';
  window.scrollTo(0, 0);
  vista.querySelectorAll('[data-p]').forEach(function(b){
    b.onclick = function(){ pltSel = b.dataset.p; verFormulario(); };
  });
}

/* ============ PASO 2: FORMULARIO ============ */
function verFormulario(){
  paso = 2; marcarPasos();
  var p = plantilla();
  var aviso = GAFETE_OBLIGATORIO
    ? '<div class="aviso-gaf">📌 <b>Importante:</b> Esta escuela incluye el <b>gafete</b> de manera obligatoria (se queda en el estudio; la escuela pasa por ellos). ' +
      'Se cobra el <b>gafete</b> más las <b>credenciales</b> que desees. Más abajo eliges cuántas credenciales quieres.</div>'
    : '';
  var h = '<h1>' + esc(p.nombre) + '</h1>' +
    '<p class="sub">Llena todos los datos con cuidado. Después podrás revisarlos antes de enviar.</p>' +
    aviso +
    '<form id="form" novalidate><fieldset><legend>Datos de contacto</legend>' +
    '<div class="c" id="c_telcontacto">' +
    '<label for="telContacto">Tel\u00e9fono de contacto (WhatsApp) <span class="ob">*</span></label>' +
    '<p class="ay">A este n\u00famero te avisaremos cuando est\u00e9 lista.</p>' +
    '<input type="tel" id="telContacto" inputmode="numeric" maxlength="10" placeholder="10 d\u00edgitos" value="' + esc(V._telefono || '') + '">' +
    '</div></fieldset>' +
    '<fieldset><legend>Datos del documento</legend>';

  campos().forEach(function(c){
    // Valor fijo: lo pone el estudio, no el cliente. No se muestra, pero sí sale en la credencial.
    if (c.fijo){ V[c.id] = (c.valorFijo != null ? c.valorFijo : ''); return; }
    var v = V[c.id];

    // Nombre del niño puesto en el POS: se muestra pero NO se puede cambiar (seguridad)
    if (c.id === 'nombre' && TITULAR_FIJO){
      V[c.id] = TITULAR_FIJO;
      h += '<div class="c" id="c_' + esc(c.id) + '">';
      h += '<label>' + esc(c.etiqueta) + '</label>';
      h += '<p class="ay">Este nombre ya viene registrado y no se puede cambiar.</p>';
      h += '<input type="text" value="' + esc(TITULAR_FIJO) + '" readonly disabled ' +
           'style="background:#efe7d9;color:#5b5044;cursor:not-allowed">';
      h += '</div>';
      return;
    }

    h += '<div class="c" data-id="' + esc(c.id) + '" id="c_' + esc(c.id) + '">';
    h += '<label for="f_' + esc(c.id) + '">' + esc(c.etiqueta) + (c.req ? ' <span class="ob">*</span>' : '') + '</label>';
    if (c.ayuda) h += '<p class="ay">' + esc(c.ayuda) + '</p>';

    if (c.tipo === 'texto')
      h += '<input type="text" id="f_' + esc(c.id) + '" data-campo="' + esc(c.id) + '" autocomplete="off" value="' + esc(v || '') + '">';
    else if (c.tipo === 'parrafo')
      h += '<textarea id="f_' + esc(c.id) + '" data-campo="' + esc(c.id) + '">' + esc(v || '') + '</textarea>';
    else if (c.tipo === 'lista'){
      var ops = c.opciones || [];
      h += '<select id="f_' + esc(c.id) + '" data-campo="' + esc(c.id) + '">' +
        '<option value="">Elige una opción…</option>' +

  });
  vista.querySelectorAll('[data-brillo]').forEach(function(r){
    r.addEventListener('input', function(){ var v = V[r.dataset.brillo]; if (v){ v.brillo = +r.value; previewFoto(r.dataset.brillo); } });

function revisar(){
  var faltan = [];
  // Teléfono de contacto obligatorio (10 dígitos)
  var telOk = V._telefono && /^\d{10}$/.test(V._telefono);
  var elTel = document.getElementById('c_telcontacto');
  if (elTel) elTel.classList.toggle('falta', intentoEnvio && !telOk);
  if (!telOk) faltan.push({ etiqueta: 'Teléfono de contacto' });

  campos().forEach(function(c){
    if (c.fijo) return;                 // los fijos no los llena el cliente
    var v = V[c.id];
    var vacio;
    if (c.tipo === 'foto') vacio = !(v && (v.src || v.estudio));   // estudio cuenta como completo
    else if (c.tipo === 'firma') vacio = !(v && v.src);
    else vacio = !(v && String(v).trim());
    if (c.req && vacio) faltan.push(c);
    var el = document.getElementById('c_' + c.id);
    if (el) el.classList.toggle('falta', intentoEnvio && c.req && vacio);
  });
  return faltan;
}

/* ============ FIRMA ============ */
var firmaCampo = null, fCtx = null, dibujando = false, huboTrazo = false;
function abrirFirma(id){
  firmaCampo = id;
  $('#veloFirma').classList.add('on');
  var cv = $('#firmaLienzo');
  var r = cv.getBoundingClientRect(), k = Math.min(3, window.devicePixelRatio || 1) * 2;
  cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
  fCtx = cv.getContext('2d');
  fCtx.setTransform(k, 0, 0, k, 0, 0);
  fCtx.lineWidth = 2.6; fCtx.lineCap = 'round'; fCtx.lineJoin = 'round'; fCtx.strokeStyle = '#101010';
  huboTrazo = false;
}
(function(){
  var cv = $('#firmaLienzo');
  function pos(ev){ var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  cv.addEventListener('pointerdown', function(ev){
    if (!fCtx) return;
    dibujando = true; huboTrazo = true;
    var p = pos(ev); fCtx.beginPath(); fCtx.moveTo(p.x, p.y);
    cv.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  cv.addEventListener('pointermove', function(ev){
    if (!dibujando) return;
    var p = pos(ev); fCtx.lineTo(p.x, p.y); fCtx.stroke(); ev.preventDefault();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(e){
    cv.addEventListener(e, function(){ dibujando = false; });
  });
})();
$('#fBorrar').onclick = function(){ var cv = $('#firmaLienzo'); fCtx.clearRect(0, 0, cv.width, cv.height); huboTrazo = false; };
$('#fCancel').onclick = function(){ $('#veloFirma').classList.remove('on'); };
$('#fOk').onclick = function(){
  if (!huboTrazo) return avisar('Dibuja la firma antes de continuar', true);
  var url = recortarFirma($('#firmaLienzo'));
  var id = firmaCampo;
  V[id] = { src: url };
  CEDULA.cargarImagen(url).then(function(){
    $('#veloFirma').classList.remove('on');
    var cont = document.getElementById('firma_' + id);
    if (cont){
      cont.innerHTML = '<img src="' + url + '" alt="Firma capturada">' +
        '<button type="button" class="b chico" data-firma="' + id + '">Repetir firma</button>';
      cont.querySelector('[data-firma]').onclick = function(){ abrirFirma(id); };
    }
    if (intentoEnvio) revisar();
  });
};
function recortarFirma(cv){
  var ctx = cv.getContext('2d');
  var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  var x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0, hay = false;
  for (var y = 0; y < cv.height; y += 2){
    for (var x = 0; x < cv.width; x += 2){
      if (d[(y * cv.width + x) * 4 + 3] > 12){
        hay = true;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (!hay) return cv.toDataURL('image/png');
  var m = 14;
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
  x1 = Math.min(cv.width, x1 + m); y1 = Math.min(cv.height, y1 + m);
  var out = document.createElement('canvas');
  out.width = x1 - x0; out.height = y1 - y0;
  out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

function armarImagenes(){
  var p = plantilla();
  var docs = [p];
  // Si pidió gafete (y hay plantilla de gafete), se genera también con los mismos datos
  var gafetePlt = E.plantillas.find(function(t){ return /gafete/i.test(t.nombre) && t.id !== pltSel; });
  if (QUIERE_GAFETE && gafetePlt) docs.push(gafetePlt);

  var fmt = D.formato || 'jpeg';
  // Precargar imágenes de todas las plantillas necesarias
  return Promise.all(docs.map(function(d){ return CEDULA.precargar(d, V); })).then(function(){
    var lista = [];
    docs.forEach(function(d){
      var c = document.createElement('canvas');
      CEDULA.dibujar(c, d, V, { escala: 1 });
      var r = CEDULA.exportar(c, fmt, 0.95);
      lista.push({ nombre: d.nombre, datos: r.base64, mime: r.mime, ext: r.ext,
                   ancho: c.width, alto: c.height, ppp: r.ppp });
    });
    return lista;
  });
}

function datosPlanos(){
  var o = [];
  campos().forEach(function(c){
    if (c.tipo === 'texto' || c.tipo === 'parrafo'){
      var v = String(V[c.id] || '').trim();
      o.push({ etiqueta: c.etiqueta, valor: c.mayus ? v.toUpperCase() : v });
    }
  });
  return o;
}

function comprimirSrc(src, maxLado){
  return new Promise(function(res){
    if (!src || String(src).indexOf('data:') !== 0) return res(src);
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height, sc = Math.min(1, maxLado / Math.max(w, h));
      w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try { res(c.toDataURL('image/jpeg', 0.85)); } catch(e){ res(src); }
    };
    img.onerror = function(){ res(src); };
    img.src = src;
  });
}
// Copia de los valores con las fotos comprimidas (para guardar los datos y poder editarlos luego)
function valoresLigeros(V){
  var claves = Object.keys(V);
  return Promise.all(claves.map(function(k){
    var v = V[k];
    if (v && typeof v === 'object' && v.src){
      return comprimirSrc(v.src, 1100).then(function(s){
        var v2 = {}; for (var kk in v) v2[kk] = v[kk]; v2.src = s; return [k, v2];
      });
    }
    return Promise.resolve([k, v]);
  })).then(function(pares){
    var out = {}; pares.forEach(function(p){ out[p[0]] = p[1]; }); return out;
  });
}

  paso = 4; marcarPasos();
  vista.innerHTML = '<div class="cargando"><div class="rueda"></div>' +
    '<p>Generando tu documento y envi\u00e1ndolo.<br>No cierres esta p\u00e1gina.</p></div>';
  window.scrollTo(0, 0);

  var p = plantilla(), titular = '';
  campos().some(function(c){
    if ((c.tipo === 'texto' || c.tipo === 'parrafo') && /nombre/i.test(c.etiqueta) && V[c.id]){
      titular = String(V[c.id]).trim().toUpperCase(); return true;
    }
    return false;
  });

  armarImagenes().then(function(imagenes){
    // Fotos que se tomarán en el estudio (pendientes)
    var fotosEstudio = campos().filter(function(c){
      return c.tipo === 'foto' && V[c.id] && V[c.id].estudio;
    }).map(function(c){ return { id: c.id, etiqueta: c.etiqueta }; });

    // Folio único para esta credencial
    var folio = 'CR' + Date.now().toString(36).toUpperCase();

    var pendiente = fotosEstudio.length > 0;
    var gafetePlt = E.plantillas.find(function(t){ return /gafete/i.test(t.nombre) && t.id !== pltSel; });
    var conGafete = QUIERE_GAFETE && !!gafetePlt;
    var carga = {
      action: 'credencial',
      folio: folio,
      code: CODIGO_USO,
      customer: titular || 'SIN NOMBRE',
      telefono: V._telefono || '',
      escuela: E.nombre, corto: E.corto || E.nombre, codigo: E.codigo || E.id,
      documento: p.nombre,
      imagenes: imagenes,
      cantidad: CANTIDAD,
      gafete: conGafete,
      detalle: [{ tam: 'Credencial · ' + (E.corto || E.nombre), cant: CANTIDAD, importe: 0 }],
      total: 0,
      pendiente_estudio: pendiente,
      fotos_estudio: fotosEstudio,
      enviado: new Date().toISOString()
    };
    // Guardamos SIEMPRE los datos (con fotos comprimidas) para poder editar/corregir después en el POS
    valoresLigeros(V).then(function(vLig){
      carga.pend_data = {
        codigo: E.codigo || E.id,
        documento: p.nombre,
        plantillaId: p.id,
        cantidad: CANTIDAD,
        gafete: conGafete,
        valores: vLig
      };
      // Se manda al MISMO backend de las fotos (el POS lo verá con ticket, el Vigilante lo mueve)
      var destino = CRED_BACKEND || D.servidor;
      if (!destino) return Promise.reject(new Error('sin_servidor'));
      return fetch(destino, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(carga)
      }).then(function(r){ return r.json(); });
    }).then(function(res){
      if (res && res.ok === false) throw new Error(res.error || 'error');
      verFinal(res || {});
    }).catch(function(err){
      verError(err && err.message === 'sin_servidor');
    });
  }).catch(function(err){
    verError(false);
  });
}

function verFinal(res){
  paso = 4; marcarPasos();
  var p = plantilla();
  vista.innerHTML = '<div class="listo"><h2>Listo, ya la recibimos</h2>' +
    '<p style="margin:0;color:#7d6d59">Tu ' + esc(p.nombre.toLowerCase()) + ' qued\u00f3 guardada. ' +
    'Nosotros nos encargamos de la impresi\u00f3n.</p>' +
    (res.folio ? '<div class="folio">FOLIO ' + esc(res.folio) + '</div>' : '') +
    '<p style="margin:18px 0 0;font-size:14px;color:#7d6d59">Si notas un error, av\u00edsanos por WhatsApp' +
    (res.folio ? ' con tu folio' : '') + '.</p></div>';
  window.scrollTo(0, 0);
}

function verError(sinServidor){
  paso = 3; marcarPasos();
  vista.innerHTML = '<div class="listo malo"><h2>No se pudo enviar</h2>' +
    '<p style="margin:0;color:#7d6d59">' +
    (sinServidor
      ? 'Todav\u00eda no est\u00e1 configurado el destino en Google Drive. Avisa a quien te envi\u00f3 la liga.'
      : 'Revisa tu conexi\u00f3n a internet e int\u00e9ntalo otra vez. Tus datos siguen aqu\u00ed, no se perdieron.') +
    '</p></div>' +
    '<button class="b pri gr" style="margin-top:14px" id="bReintentar">Intentar de nuevo</button>' +
    '<button class="b gr" style="margin-top:10px" id="bAtras">Volver a revisar</button>';
  window.scrollTo(0, 0);
  $('#bReintentar').onclick = enviar;
  $('#bAtras').onclick = verRevision;
}
