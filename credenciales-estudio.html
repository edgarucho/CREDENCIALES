<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminar credencial · Foto Graciela</title>
<style>
  :root{ --tinta:#241d16; --papel:#f6efe5; --acento:#c5572a; --ok:#1f7a4d; --linea:#e6ddd0; --muted:#8a7a66; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  header{background:var(--tinta);color:var(--papel);padding:14px 18px;display:flex;align-items:center;gap:10px}
  header b{font-size:16px;letter-spacing:.02em}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .cols{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
  @media(max-width:820px){ .cols{grid-template-columns:1fr} }
  .previa{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px;text-align:center}
  .previa canvas{max-width:100%;height:auto;border-radius:6px}
  .panel{background:#fffdf9;border:1px solid var(--linea);border-radius:12px;padding:16px}
  .campo{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--linea)}
  .campo:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .campo h3{margin:0 0 8px;font-size:15px}
  .sub-foto{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .mini{width:56px;height:56px;border-radius:8px;background:#eee center/cover no-repeat;border:1px solid var(--linea);flex:none}
  .b{padding:9px 14px;border:none;border-radius:9px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;background:#efe7d9;color:var(--tinta)}
  .b.pri{background:var(--acento);color:#fff}
  .b.ok{background:var(--ok);color:#fff}
  .b.gr{width:100%;padding:14px;font-size:16px;margin-top:10px}
  .ctrl{margin-top:8px}
  .fprev{display:block;width:100%;max-width:300px;margin:0 auto 10px;border:2px solid var(--acento,#c5572a);border-radius:8px;background:#f0ece4}
  .ctrl label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px;font-weight:600}
  .ctrl input[type=range]{width:100%}
  .rotval{font-weight:700;color:var(--acento)}
  .estado{text-align:center;padding:40px 20px}
  .rueda{width:42px;height:42px;border:4px solid #e6ddd0;border-top-color:var(--acento);border-radius:50%;margin:0 auto 14px;animation:giro 1s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}
  .aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .aviso.on{opacity:1}
  .info{background:#f2ece1;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}
  .secc{margin-bottom:14px}
  .secc>h3{margin:6px 0 10px;font-size:15px;border-bottom:2px solid var(--linea);padding-bottom:5px}
  .campo>h4{margin:0 0 6px;font-size:13.5px}
  .lb{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:8px 0 3px}
  .panel input[type=text], .panel textarea, .panel select, .panel input[type=time]{
    width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--linea);border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
  .panel textarea{min-height:56px;resize:vertical}
  .hr{display:flex;align-items:center;gap:8px}
  .hr input{flex:1}
</style>
</head>
<body>
<header><b>🎫 Terminar credencial · Foto Graciela</b></header>
<div class="wrap" id="wrap">
  <div class="estado"><div class="rueda"></div><p>Cargando la credencial…</p></div>
</div>
<div class="aviso" id="aviso"></div>

<script src="credenciales-motor.js"></script>
<script>
(function(){
'use strict';
var CRED_BACKEND = "https://script.google.com/macros/s/AKfycbxN01-DfwGkwwfilu6lfk_AYMMLa1S2SfJCkKYRMOYve948MtRB93N9blMU9vamD72I/exec";
var $ = function(s){ return document.querySelector(s); };
var wrap = $('#wrap');
var folio = new URLSearchParams(location.search).get('folio') || '';
var D = (window.PLANTILLAS_BASE || { escuelas: [] });
var E = null, plt = null, V = {}, meta = {};

function aviso(t){ var a=$('#aviso'); a.textContent=t; a.classList.add('on'); setTimeout(function(){a.classList.remove('on');},2200); }

if (!folio){ wrap.innerHTML = '<h1>Falta el folio</h1><p class="sub">Abre esta página desde el Punto de Venta.</p>'; return; }

// Fetch con límite de tiempo (para que NUNCA se quede cargando para siempre)
function fetchT(url, opts, ms){
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  opts = opts || {}; if (ctrl) opts.signal = ctrl.signal;
  var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, ms || 25000);
  return fetch(url, opts).then(function(r){ clearTimeout(t); return r; },
                              function(e){ clearTimeout(t); throw e; });
}

// 0) Cargar los diseños del archivo credenciales-plantillas.js de GitHub, sin caché.
function cargarPlantillasNubeE(){
  return CEDULA.cargarArchivo().then(function(base){
    if (base && base.escuelas && base.escuelas.length) D = base;
  }).catch(function(){ /* sin internet: seguimos con lo que haya */ });
}

// 1) Traer los datos guardados de la credencial y armar el editor
function cargarCredencial(){
  wrap.innerHTML = '<div class="estado"><div class="rueda"></div><p>Cargando la credencial…</p></div>';
  cargarPlantillasNubeE().then(function(){
    return fetchT(CRED_BACKEND, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'credpend', folio: folio })
    }, 30000).then(function(r){ return r.json(); });
  }).then(function(res){
    if (!res || !res.ok){ throw new Error((res && res.error) || 'error'); }
    meta = res.datos || {};
    V = meta.valores || {};
    E = (D.escuelas||[]).find(function(e){
      return (e.codigo && meta.codigo && e.codigo.toUpperCase()===String(meta.codigo).toUpperCase()) || e.id===meta.codigo;
    });
    if (E) plt = (E.plantillas||[]).find(function(p){ return p.id===meta.plantillaId || p.nombre===meta.documento; });
    if (!E || !plt){ throw new Error('sin_plantilla'); }
    if (typeof CEDULA==='undefined'){ throw new Error('sin_motor'); }
    montar();
  }).catch(function(err){
    var m = (err && err.message) || '', nm = (err && err.name) || '';
    var msg = (m==='sin_plantilla') ? 'No encontré la plantilla de esta escuela en este equipo. Sube la versión más reciente de las plantillas.'
      : (m==='no_datos' || m==='no_folio') ? 'No se encontraron los datos de esta credencial. Puede que se haya creado antes de la última actualización, o que ya se haya terminado.'
      : (m==='sin_motor') ? 'No cargó el motor de credenciales. Recarga la página.'
      : (nm==='AbortError') ? 'El servidor tardó demasiado en responder. Revisa tu internet e inténtalo otra vez.'
      : 'No se pudo conectar. Revisa tu internet e inténtalo otra vez.';
    wrap.innerHTML = '<h1>No se pudo cargar</h1><p class="sub">'+msg+'</p>'+
      '<button id="reintentar" style="margin-top:16px;padding:11px 22px;border:none;border-radius:9px;background:#1f7a4d;color:#fff;font-weight:700;font-size:15px;cursor:pointer">↻ Reintentar</button>';
    var rb=$('#reintentar'); if(rb) rb.onclick=cargarCredencial;
  });
}
cargarCredencial();

// Campos de foto que faltan (los que quedaron marcados como estudio)
function fotosEstudio(){
  return (plt.campos||[]).filter(function(c){
    return c.tipo==='foto' && V[c.id] && V[c.id].estudio;
  });
}

function montar(){
  var h = '<h1>'+esc(E.corto||E.nombre)+' \u00b7 '+esc(plt.nombre)+'</h1>'+
    '<p class="sub">Titular: <b>'+esc(nombreTitular())+'</b></p>'+
    '<div class="cols">'+
      '<div class="previa"><canvas id="lienzo"></canvas></div>'+
      '<div class="panel" id="panel"></div>'+
    '</div>';
  wrap.innerHTML = h;
  var panel = $('#panel');
  var ph = '<div class="info">Corrige los datos y encuadra las fotos. Cuando quede bien, presiona <b>Guardar</b>.</div>';

  var textos = (plt.campos||[]).filter(function(c){ return !c.fijo && (c.tipo==='texto'||c.tipo==='parrafo'||c.tipo==='lista'||c.tipo==='horario'); });
  if (textos.length){
    ph += '<div class="secc"><h3>Datos</h3>';
    textos.forEach(function(c){
      var val = V[c.id]!=null ? V[c.id] : '';
      ph += '<label class="lb">'+esc(c.etiqueta)+'</label>';
      if (c.tipo==='parrafo') ph += '<textarea data-txt="'+esc(c.id)+'">'+esc(val)+'</textarea>';
      else if (c.tipo==='lista'){
        ph += '<select data-txt="'+esc(c.id)+'"><option value="">\u2014</option>';
        (c.opciones||[]).forEach(function(o){ ph += '<option'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>'; });
        ph += '</select>';
      } else if (c.tipo==='horario'){
        var pr=String(val).split(' a ');
        ph += '<div class="hr"><input type="time" data-h1="'+esc(c.id)+'" value="'+esc(pr[0]||'')+'"> a <input type="time" data-h2="'+esc(c.id)+'" value="'+esc(pr[1]||'')+'"></div>';
      } else ph += '<input type="text" data-txt="'+esc(c.id)+'" value="'+esc(val)+'">';
    });
    ph += '</div>';
  }

  var fotos = (plt.campos||[]).filter(function(c){ return c.tipo==='foto'; });
  if (fotos.length){
    ph += '<div class="secc"><h3>Fotos</h3>';
    fotos.forEach(function(c){
      var v = V[c.id]||{}; var hayFoto = !!v.src;
      ph += '<div class="campo" data-c="'+esc(c.id)+'">'+
        '<h4>'+esc(c.etiqueta)+'</h4>'+
        '<div class="sub-foto"><span class="mini" id="mini_'+esc(c.id)+'"'+(hayFoto?(' style="background-image:url('+v.src+')"'):'')+'></span>'+
        '<button class="b" data-foto="'+esc(c.id)+'">'+(hayFoto?'\ud83d\udd04 Cambiar foto':'\ud83d\udce4 Subir foto')+'</button></div>'+
        '<div class="ctrl" id="ctrl_'+esc(c.id)+'"'+(hayFoto?'':' hidden')+'>'+
          '<canvas class="fprev" id="prev_'+esc(c.id)+'"></canvas>'+
          '<label>Subir / bajar</label><input type="range" min="0" max="100" value="'+(v.pos!=null?v.pos:50)+'" data-pos="'+esc(c.id)+'">'+
          '<label>Izquierda / derecha</label><input type="range" min="0" max="100" value="'+(v.posx!=null?v.posx:50)+'" data-posx="'+esc(c.id)+'">'+
          '<label>Acercar</label><input type="range" min="100" max="240" value="'+Math.round((v.zoom||1)*100)+'" data-zoom="'+esc(c.id)+'">'+
          '<label>Girar (enderezar) \u00b7 <span class="rotval" id="rotval_'+esc(c.id)+'">'+(v.rot||0)+'\u00b0</span></label>'+
          '<input type="range" min="-15" max="15" step="0.5" value="'+(v.rot||0)+'" data-rot="'+esc(c.id)+'">'+
          '<label>Brillo</label><input type="range" min="50" max="160" value="'+(v.brillo!=null?v.brillo:100)+'" data-brillo="'+esc(c.id)+'">'+
          '<label>Contraste</label><input type="range" min="50" max="160" value="'+(v.contraste!=null?v.contraste:100)+'" data-contraste="'+esc(c.id)+'">'+
          '<button class="b" style="margin-top:6px;font-size:12px;padding:5px 10px" data-rot0="'+esc(c.id)+'">\u21ba Enderezar a 0\u00b0</button>'+
        '</div>'+
        '<input type="file" accept="image/*" hidden id="file_'+esc(c.id)+'">'+
      '</div>';
    });
    ph += '</div>';
  }

  ph += '<button class="b ok gr" id="bTerminar">\u2713 Guardar</button>';
  panel.innerHTML = ph;

  wrap.querySelectorAll('[data-txt]').forEach(function(el){
    el.addEventListener('input', function(){ V[el.dataset.txt] = el.value; dibujar(); });
  });
  function actualizarHorario(id){
    var a=wrap.querySelector('[data-h1="'+id+'"]'), b=wrap.querySelector('[data-h2="'+id+'"]');
    V[id] = (a&&a.value?a.value:'') + ' a ' + (b&&b.value?b.value:''); dibujar();
  }
  wrap.querySelectorAll('[data-h1]').forEach(function(el){ el.addEventListener('input', function(){ actualizarHorario(el.dataset.h1); }); });
  wrap.querySelectorAll('[data-h2]').forEach(function(el){ el.addEventListener('input', function(){ actualizarHorario(el.dataset.h2); }); });

  fotos.forEach(function(c){
    $('[data-foto="'+c.id+'"]').onclick = function(){ document.getElementById('file_'+c.id).click(); };
    document.getElementById('file_'+c.id).addEventListener('change', function(){
      var f = this.files[0]; this.value=''; if(!f) return;
      CEDULA.archivoAImagen(f, 1400, 0.9).then(function(r){
        V[c.id] = { src:r.src, pos:50, posx:50, zoom:1, rot:0, brillo:100, contraste:100 };
        return CEDULA.cargarImagen(r.src);
      }).then(function(){
        var mini=document.getElementById('mini_'+c.id); if(mini) mini.style.backgroundImage='url('+V[c.id].src+')';
        var ctrl=document.getElementById('ctrl_'+c.id); if(ctrl) ctrl.hidden=false;
        var sv=function(sel,val){ var s=wrap.querySelector(sel); if(s) s.value=val; };
        sv('[data-pos="'+c.id+'"]',50); sv('[data-posx="'+c.id+'"]',50); sv('[data-zoom="'+c.id+'"]',100);
        sv('[data-rot="'+c.id+'"]',0); sv('[data-brillo="'+c.id+'"]',100); sv('[data-contraste="'+c.id+'"]',100);
        previewFoto(c.id); dibujar();
      }).catch(function(){ aviso('No se pudo abrir esa imagen'); });
    });
  });

  wrap.querySelectorAll('[data-pos]').forEach(function(r){
    r.addEventListener('input', function(){ var v=V[r.dataset.pos]; if(v){ v.pos=+r.value; previewFoto(r.dataset.pos); dibujar(); } });
  });
  wrap.querySelectorAll('[data-posx]').forEach(function(r){
    r.addEventListener('input', function(){ var v=V[r.dataset.posx]; if(v){ v.posx=+r.value; previewFoto(r.dataset.posx); dibujar(); } });
  });
  wrap.querySelectorAll('[data-zoom]').forEach(function(r){
    r.addEventListener('input', function(){ var v=V[r.dataset.zoom]; if(v){ v.zoom=+r.value/100; previewFoto(r.dataset.zoom); dibujar(); } });
  });
  wrap.querySelectorAll('[data-rot]').forEach(function(r){
    r.addEventListener('input', function(){
      var v=V[r.dataset.rot]; if(v){ v.rot=+r.value;
        var lbl=document.getElementById('rotval_'+r.dataset.rot);
        if(lbl) lbl.textContent = (+r.value).toFixed(1)+'\u00b0';
        previewFoto(r.dataset.rot); dibujar();
      }
    });
  });
  wrap.querySelectorAll('[data-brillo]').forEach(function(r){
    r.addEventListener('input', function(){ var v=V[r.dataset.brillo]; if(v){ v.brillo=+r.value; previewFoto(r.dataset.brillo); dibujar(); } });
  });
  wrap.querySelectorAll('[data-contraste]').forEach(function(r){
    r.addEventListener('input', function(){ var v=V[r.dataset.contraste]; if(v){ v.contraste=+r.value; previewFoto(r.dataset.contraste); dibujar(); } });
  });
  wrap.querySelectorAll('[data-rot0]').forEach(function(b){
    b.onclick = function(){
      var id=b.dataset.rot0, v=V[id]; if(!v) return; v.rot=0;
      var sl=wrap.querySelector('[data-rot="'+id+'"]'); if(sl) sl.value=0;
      var lbl=document.getElementById('rotval_'+id); if(lbl) lbl.textContent='0\u00b0';
      previewFoto(id); dibujar();
    };
  });

  // Dibujar preview de fotos que ya tienen imagen
  fotos.forEach(function(c){ if(V[c.id] && V[c.id].src) previewFoto(c.id); });

  $('#bTerminar').onclick = terminar;
  dibujar();
}

function dibujar(){
  CEDULA.precargar(plt, V).then(function(){
    CEDULA.dibujar($('#lienzo'), plt, V, { escala: 1 });
  });
}
// Vista previa en vivo de UNA foto (exacto cómo quedará en su recuadro)
function previewFoto(id){
  var campo = (plt.campos||[]).filter(function(c){ return c.id===id; })[0];
  var canvas = document.getElementById('prev_'+id);
  if (!campo || !canvas || !V[id] || !V[id].src) return;
  CEDULA.cargarImagen(V[id].src).then(function(){
    CEDULA.dibujarFotoPreview(canvas, campo, V[id], 300);
  }).catch(function(){});
}

function nombreTitular(){
  var t = '';
  (plt.campos||[]).some(function(c){
    if ((c.tipo==='texto'||c.tipo==='parrafo') && /nombre/i.test(c.etiqueta||'') && V[c.id]){ t=String(V[c.id]).trim(); return true; }
    return false;
  });
  return t || (meta.customer || 'SIN NOMBRE');
}
function metaTel(){ return meta.telefono || ''; }

function comprimirSrc(src, maxLado){
  return new Promise(function(res){
    if (!src || String(src).indexOf('data:') !== 0) return res(src);
    var img = new Image();
    img.onload = function(){
      var w=img.width, h=img.height, sc=Math.min(1, maxLado/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ res(c.toDataURL('image/jpeg',0.85)); }catch(e){ res(src); }
    };
    img.onerror=function(){ res(src); };
    img.src=src;
  });
}
function valoresLigeros(V){
  var claves=Object.keys(V);
  return Promise.all(claves.map(function(k){
    var v=V[k];
    if (v && typeof v==='object' && v.src){
      return comprimirSrc(v.src,1100).then(function(s){ var v2={}; for(var kk in v) v2[kk]=v[kk]; v2.src=s; return [k,v2]; });
    }
    return Promise.resolve([k,v]);
  })).then(function(pares){ var out={}; pares.forEach(function(p){ out[p[0]]=p[1]; }); return out; });
}

function terminar(){

  wrap.innerHTML = '<div class="estado"><div class="rueda"></div><p>Generando la credencial y envi\u00e1ndola.<br>No cierres esta p\u00e1gina.</p></div>';

  // Documentos a generar: la plantilla + gafete si se pidió
  var docs = [plt];
  var gafetePlt = null;
  if (meta.gafete && E){
    gafetePlt = (E.plantillas||[]).find(function(t){ return /gafete/i.test(t.nombre) && t.id !== plt.id; });
    if (gafetePlt) docs.push(gafetePlt);
  }
  var fmt = D.formato || 'jpeg';

  Promise.all(docs.map(function(d){ return CEDULA.precargar(d, V); })).then(function(){
    var imagenes = docs.map(function(d){
      var c = document.createElement('canvas');
      CEDULA.dibujar(c, d, V, { escala: 1 });
      var r = CEDULA.exportar(c, fmt, 0.95);
      return { nombre:d.nombre, datos:r.base64, mime:r.mime, ext:r.ext, ancho:c.width, alto:c.height, ppp:r.ppp };
    });
    return valoresLigeros(V).then(function(vLig){
      var carga = {
        action:'credencial',
        folio: folio,                      // MISMO folio: reusa la carpeta
        customer: nombreTitular(),
        telefono: meta.telefono || '',
        escuela: (E.nombre||''), corto:(E.corto||E.nombre), codigo:(E.codigo||E.id),
        documento: plt.nombre,
        imagenes: imagenes,
        cantidad: meta.cantidad || 1,
        gafete: !!(meta.gafete && gafetePlt),
        detalle: [{ tam:'Credencial · '+(E.corto||E.nombre), cant:(meta.cantidad||1), importe:0 }],
        total: 0,
        pendiente_estudio: false,          // YA no está pendiente → el Vigilante la mueve
        pend_data: { codigo:(E.codigo||E.id), documento:plt.nombre, plantillaId:plt.id,
                     cantidad:(meta.cantidad||1), gafete:!!(meta.gafete&&gafetePlt), valores:vLig },
        enviado: new Date().toISOString()
      };
      return fetch(CRED_BACKEND, {
        method:'POST', redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(carga)
      }).then(function(r){ return r.json(); });
    });
  }).then(function(res){
    if (res && res.ok===false) throw new Error(res.error||'error');
    wrap.innerHTML = '<div class="estado"><h1>✓ Credencial terminada</h1>'+
      '<p class="sub">Ya qued\u00f3 lista y se envi\u00f3. Puedes cerrar esta ventana y volver al Punto de Venta.</p></div>';
  }).catch(function(){
    wrap.innerHTML = '<div class="estado"><h1>No se pudo enviar</h1>'+
      '<p class="sub">Revisa tu internet e int\u00e9ntalo de nuevo.</p>'+
      '<button class="b pri" onclick="location.reload()">Reintentar</button></div>';
  });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
})();
</script>
</body>
</html>
